# Passive stale-NFS signal for CT250. This stack intentionally does not manage Tunarr.
services:
  nfs-health-checker:
    image: alpine:3.21.3
    container_name: tunarr-ct250-nfs-health-checker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /metrics
        chmod 1777 /metrics
        while true; do
          temporary="/metrics/.tunarr_nfs_health.prom.$$"
          now="$$(date +%s)"
          {
            echo '# HELP tunarr_nfs_media_path_healthy 1 when a read-only Tunarr media mount can be statted.'
            echo '# TYPE tunarr_nfs_media_path_healthy gauge'
            for item in \
              'james_bond:/media/james-bond' \
              'adam_carolla:/media/adam-carolla' \
              'powerful_jre:/media/powerful-jre' \
              'autotopnl:/media/autotopnl' \
              'harrys_garage:/media/harrys-garage' \
              'theo_von:/media/theo-von'; do
              name="$${item%%:*}"
              path="$${item#*:}"
              if stat -L "$$path" >/dev/null 2>&1; then result=1; else result=0; fi
              printf 'tunarr_nfs_media_path_healthy{path="%s"} %s\n' "$$name" "$$result"
            done
            echo '# HELP tunarr_nfs_media_check_timestamp_seconds Unix timestamp for the last completed complete NFS check.'
            echo '# TYPE tunarr_nfs_media_check_timestamp_seconds gauge'
            printf 'tunarr_nfs_media_check_timestamp_seconds %s\n' "$$now"
          } > "$$temporary"
          mv "$$temporary" /metrics/tunarr_nfs_health.prom
          sleep 60
        done
    volumes:
      - nfs-health-metrics:/metrics
      - "/media/3 Folder Emby/James Bond:/media/james-bond:ro"
      - "/media/YouTube/shows/Adam Carolla:/media/adam-carolla:ro"
      - "/media/YouTube/shows/PowerfulJRE:/media/powerful-jre:ro"
      - "/media/YouTube/shows/AutoTopNL:/media/autotopnl:ro"
      - "/media/YouTube/shows/Harry's garage:/media/harrys-garage:ro"
      - "/media/YouTube/shows/Theo Von:/media/theo-von:ro"

  tunarr-session-checker:
    image: alpine:3.21.3
    container_name: tunarr-ct250-nfs-health-session-checker
    restart: unless-stopped
    # Shares only Tunarr's own namespaces. It cannot see the CT host.
    pid: "container:tunarr"
    network_mode: "container:tunarr"
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          temporary="/metrics/.tunarr_hls_session.prom.$"
          now="$(date +%s)"
          {
            echo '# HELP tunarr_hls_ffmpeg_processes Number of ffmpeg processes in the Tunarr container namespace.'
            echo '# TYPE tunarr_hls_ffmpeg_processes gauge'
            ffmpeg=0
            for comm in /proc/[0-9]*/comm; do
              if [ -r "$comm" ] && [ "$(cat "$comm" 2>/dev/null)" = ffmpeg ]; then ffmpeg=$((ffmpeg + 1)); fi
            done
            printf 'tunarr_hls_ffmpeg_processes %s\\n' "$ffmpeg"
            echo '# HELP tunarr_hls_tcp_clients Established TCP clients currently connected to Tunarr port 8005.'
            echo '# TYPE tunarr_hls_tcp_clients gauge'
            clients=$(awk '$4 == "01" && $2 ~ /:1F45$/ { count++ } END { print count + 0 }' /proc/net/tcp /proc/net/tcp6 2>/dev/null)
            printf 'tunarr_hls_tcp_clients %s\\n' "$clients"
            echo '# HELP tunarr_hls_session_check_timestamp_seconds Unix timestamp of the completed Tunarr session check.'
            echo '# TYPE tunarr_hls_session_check_timestamp_seconds gauge'
            printf 'tunarr_hls_session_check_timestamp_seconds %s\\n' "$now"
          } > "$temporary"
          mv "$temporary" /metrics/tunarr_hls_session.prom
          sleep 60
        done
    volumes:
      - nfs-health-metrics:/metrics
    depends_on:
      - nfs-health-checker

  nfs-health-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: tunarr-ct250-nfs-health-exporter
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    command:
      - --web.listen-address=:9101
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/textfile
    ports:
      - "9101:9101"
    volumes:
      - nfs-health-metrics:/textfile:ro
    depends_on:
      - nfs-health-checker

volumes:
  nfs-health-metrics:
