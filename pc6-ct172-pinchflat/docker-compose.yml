# Dedicated Pinchflat stack on Proxmox CT172 (pc6).
# Application state is local; only media downloads are written to Tower.
services:
  pinchflat:
    image: ghcr.io/kieraneglin/pinchflat@sha256:01b4f98aabaf3f5fe394213f7a32578c9e84e42080f52e2f8334021a4473b202
    container_name: pinchflat
    ports:
      - "8945:8945"
    environment:
      TZ: "${TZ:-Europe/Oslo}"
      YT_DLP_WORKER_CONCURRENCY: "1"
    volumes:
      - "${PINCHFLAT_CONFIG_PATH:?Set PINCHFLAT_CONFIG_PATH in Komodo}:/config"
      - "${TOWER_MEDIA_PATH:?Set TOWER_MEDIA_PATH in Komodo}/YouTube:/downloads"
    mem_limit: 3g
    cpus: 2
    pids_limit: 512
    stop_grace_period: 2m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8945/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
