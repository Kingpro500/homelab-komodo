# pc9-ct135-loki: sentral loggagring (VictoriaLogs). Mappenavnet beholdes = Komodo-stacknavn.
services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    container_name: victorialogs
    restart: unless-stopped
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=30d
      - -httpListenAddr=:9428
      - -syslog.listenAddr.udp=:514
      - -syslog.listenAddr.tcp=:514
      - -syslog.timezone=Europe/Oslo
    ports:
      - "9428:9428"
      - "514:514/udp"
      - "514:514/tcp"
    volumes:
      - vlogs-data:/vlogs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9428/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  alloy:
    image: grafana/alloy:v1.10.0
    container_name: alloy
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    hostname: pc9-ct135
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - victorialogs
volumes:
  vlogs-data:
  alloy-data:
