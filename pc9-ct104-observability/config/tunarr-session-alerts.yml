groups:
  - name: tunarr-session-diagnostics
    rules:
      - alert: TunarrHlsSessionMetricMissing
        expr: absent(tunarr_hls_session_check_timestamp_seconds{job=~"tunarr-nfs-health(-ct250)?"})
        for: 5m
        labels: {severity: warning, service: tunarr}
        annotations:
          summary: "Tunarr HLS session monitoring is missing"
          description: "The namespace-isolated Tunarr session diagnostic is unavailable. No automatic action is performed."
      - alert: TunarrHlsSessionCheckStalled
        expr: time() - tunarr_hls_session_check_timestamp_seconds{job=~"tunarr-nfs-health(-ct250)?"} > 180
        for: 2m
        labels: {severity: warning, service: tunarr}
        annotations:
          summary: "Tunarr HLS session check is stalled"
          description: "The passive session diagnostic has not completed recently. Inspect the CT before any manual recovery."
      - alert: TunarrProbableOrphanedHlsSession
        expr: (tunarr_hls_ffmpeg_processes{job=~"tunarr-nfs-health(-ct250)?"} > 0) and on (job, instance) (max_over_time(tunarr_hls_tcp_clients{job=~"tunarr-nfs-health(-ct250)?"}[30m]) == 0)
        for: 30m
        labels: {severity: info, service: tunarr}
        annotations:
          summary: "Tunarr may have a clientless background HLS session"
          description: "FFmpeg remains active while no TCP client has been observed for 30 minutes. This is diagnostic only; verify playback before any Komodo-managed Tunarr restart. Emby must not be restarted."
