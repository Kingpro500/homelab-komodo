global:
  scrape_interval: 30s
  evaluation_interval: 30s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
rule_files:
  - "/etc/prometheus/alerts.yml"
  - "/etc/prometheus/network-alerts.yml"
  - "/etc/prometheus/tunarr-session-alerts.yml"
  - "/etc/prometheus/media-services-alerts.yml"
scrape_configs:
  - job_name: blackbox-http
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets:
          - http://10.0.0.150:8096/web/
          - http://10.0.0.123:8005/web/
          - http://10.0.0.123:8005/api/channels.m3u
          - http://10.0.0.123:8005/api/xmltv.xml
          - http://10.0.0.122:8005/web/
          - http://10.0.0.122:8005/api/channels.m3u
          - http://10.0.0.122:8005/api/xmltv.xml
          - "http://10.0.0.126:9090/-/ready"
          - "http://10.0.0.126:9093/-/ready"
          - http://10.0.0.126:9115/metrics
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox:9115"}
  - job_name: homelab-exporter
    static_configs:
      - targets: ["10.0.0.135:9120"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: (emby_.*|proxmox_guest_.*)
        action: keep
  - job_name: network-interface
    scrape_interval: 30s
    static_configs:
      - targets: ["network-interface-exporter:9122"]
  - job_name: homeassistant-memory
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets: ["10.0.0.120:9103"]
  - job_name: opnsense-resources
    static_configs:
      - targets: ["10.0.0.135:9133"]
  - job_name: opnsense-crash-status
    scrape_interval: 30s
    static_configs:
      - targets: ["10.0.0.135:9130"]
  - job_name: emby-transcode-exporter
    static_configs:
      - targets: ["10.0.0.150:9121"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: emby_transcode_.*
        action: keep
  - job_name: tunarr-nfs-health
    scrape_interval: 30s
    static_configs:
      - targets: ["10.0.0.122:9101"]
  - job_name: tunarr-nfs-health-ct250
    scrape_interval: 30s
    static_configs:
      - targets: ["10.0.0.123:9101"]
  - job_name: blackbox-media-services
    metrics_path: /probe
    params: {module: [tcp_connect]}
    static_configs:
      - {targets: ["10.0.0.128:8989"], labels: {app: sonarr}}
      - {targets: ["10.0.0.128:7878"], labels: {app: radarr}}
      - {targets: ["10.0.0.128:9696"], labels: {app: prowlarr}}
      - {targets: ["10.0.0.128:6767"], labels: {app: bazarr}}
      - {targets: ["10.0.0.128:8787"], labels: {app: readarr}}
      - {targets: ["10.0.0.128:8112"], labels: {app: deluge}}
      - {targets: ["10.0.0.128:5055"], labels: {app: seerr}}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox:9115"}
  - job_name: blackbox-tcp
    metrics_path: /probe
    params: {module: [tcp_connect]}
    static_configs:
      - targets: ["10.0.0.120:22", "10.0.0.120:8006"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox:9115"}
  - job_name: blackbox-wan-icmp-pc9
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /probe
    params: {module: [icmp]}
    static_configs:
      - targets: ["10.0.0.1", "1.1.1.1", "9.9.9.9"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox:9115"}
  - job_name: blackbox-wan-dns-pc9
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /probe
    params: {module: [dns_udp]}
    static_configs:
      - targets: ["10.0.0.1:53", "1.1.1.1:53", "9.9.9.9:53"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox:9115"}
