global:
  scrape_interval: 30s
  evaluation_interval: 30s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: blackbox-http
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets:
          - http://10.0.0.150:8096/web/
          - http://10.0.0.123:8005/web/
          - http://10.0.0.123:8005/api/channels.m3u
          - http://10.0.0.123:8005/api/xmltv.xml
          - http://10.0.0.122:8005/web/
          - http://10.0.0.122:8005/api/channels.m3u
          - http://10.0.0.122:8005/api/xmltv.xml
          - http://10.0.0.128:9090/-/ready
          - http://10.0.0.128:9093/-/ready
          - http://10.0.0.124:9115/metrics
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox:9115}
  - job_name: blackbox-tcp
    metrics_path: /probe
    params: {module: [tcp_connect]}
    static_configs:
      - targets: ["10.0.0.120:22", "10.0.0.120:8006"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox:9115}
