groups:
  - name: availability
    rules:
      - alert: EmbyUnavailable
        expr: probe_success{instance="http://10.0.0.150:8096/web/"} == 0
        for: 2m
        labels: {severity: critical, service: emby, node: pc6}
        annotations: {summary: "Emby is unavailable from PC9"}
      - alert: TunarrCt250Unavailable
        expr: probe_success{instance="http://10.0.0.123:8005/web/"} == 0
        for: 2m
        labels: {severity: warning, service: tunarr, node: pc6}
        annotations: {summary: "Tunarr CT250 is unavailable from PC9"}
      - alert: TunarrFeedUnavailable
        expr: probe_success{instance=~"http://10.0.0.(122|123):8005/api/(channels.m3u|xmltv.xml)"} == 0
        for: 5m
        labels: {severity: warning, service: tunarr}
        annotations: {summary: "A Tunarr feed is unavailable"}
      - alert: Pc6HostUnavailable
        expr: probe_success{instance=~"10.0.0.120:(22|8006)"} == 0
        for: 2m
        labels: {severity: critical, service: proxmox, node: pc6}
        annotations: {summary: "PC6 is unavailable from PC9"}
      - alert: Pc9ObservabilityComponentUnavailable
        expr: probe_success{instance=~"http://10.0.0.126:(9090/-/ready|9093/-/ready)|10.0.0.124:9115/metrics"} == 0
        for: 2m
        labels: {severity: warning, service: observability, node: pc9}
        annotations: {summary: "A PC9 observability component is unavailable"}
      # Proxmox guest rules are deduplicated by guest identity.
      - alert: GuestMemoryHigh
        expr: max by (name, node, type, vmid) ((proxmox_guest_mem_used_bytes / proxmox_guest_mem_total_bytes) * 100) >= 90
        for: 10m
        labels: {severity: warning, service: proxmox}
        annotations: {summary: "Proxmox guest memory usage is high"}
      - alert: GuestMemoryCritical
        expr: max by (name, node, type, vmid) ((proxmox_guest_mem_used_bytes / proxmox_guest_mem_total_bytes) * 100) >= 97
        for: 5m
        labels: {severity: critical, service: proxmox}
        annotations: {summary: "Proxmox guest memory usage is critical"}
      - alert: GuestDiskHigh
        expr: max by (name, node, type, vmid) ((proxmox_guest_disk_used_bytes / proxmox_guest_disk_total_bytes) * 100) >= 85
        for: 10m
        labels: {severity: warning, service: proxmox}
        annotations: {summary: "Proxmox guest disk usage is high"}
      - alert: GuestDiskCritical
        expr: max by (name, node, type, vmid) ((proxmox_guest_disk_used_bytes / proxmox_guest_disk_total_bytes) * 100) >= 90
        for: 5m
        labels: {severity: critical, service: proxmox}
        annotations: {summary: "Proxmox guest disk usage is critical"}
      - alert: GuestSustainedCPU
        expr: max by (name, node, type, vmid) (proxmox_guest_cpu_percent) >= 90
        for: 10m
        labels: {severity: info, service: proxmox}
        annotations: {summary: "Proxmox guest CPU usage is sustained"}
