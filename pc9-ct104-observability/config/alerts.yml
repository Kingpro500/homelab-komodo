groups:
  - name: availability
    rules:
      - alert: EmbyUnavailable
        expr: probe_success{instance="http://10.0.0.150:8096/web/"} == 0
        for: 2m
        labels: {severity: critical, service: emby, node: pc6}
        annotations: {summary: "Emby is unavailable from PC9"}
      - alert: EmbyDown
        expr: emby_up{instance="emby"} == 0
        for: 2m
        labels: {severity: critical, service: emby, node: pc6}
        annotations: {summary: "Emby health exporter reports unavailable"}
      - alert: EmbySessionsUnknown
        expr: emby_sessions_known{instance="emby"} == 0
        for: 2m
        labels: {severity: critical, service: emby, node: pc6}
        annotations: {summary: "Emby sessions status is unknown; recovery must remain blocked"}
      - alert: EmbyProbeDegraded
        expr: emby_probe_success{instance="emby"} < emby_probe_total{instance="emby"}
        for: 5m
        labels: {severity: warning, service: emby, node: pc6}
        annotations: {summary: "Emby authenticated health probes are degraded"}
      - alert: EmbyDiskHigh
        expr: (proxmox_guest_disk_used_bytes{vmid="200"} / proxmox_guest_disk_total_bytes{vmid="200"}) * 100 >= 75
        for: 10m
        labels: {severity: warning, service: emby, node: pc6}
        annotations: {summary: "Emby CT200 disk usage is high", description: "CT200 disk usage is above 75%; inspect /opt/emby/transcode before service impact."}
      - alert: EmbyDiskCritical
        expr: (proxmox_guest_disk_used_bytes{vmid="200"} / proxmox_guest_disk_total_bytes{vmid="200"}) * 100 >= 85
        for: 5m
        labels: {severity: critical, service: emby, node: pc6}
        annotations: {summary: "Emby CT200 disk usage is critical", description: "CT200 disk usage is above 85%; recovery must be guarded by active-session checks."}
      - alert: EmbyDiskExporterMissing
        expr: absent(proxmox_guest_disk_used_bytes{vmid="200"}) or absent(proxmox_guest_disk_total_bytes{vmid="200"})
        for: 5m
        labels: {severity: critical, service: emby, node: pc6}
        annotations: {summary: "Emby CT200 disk metric is missing", description: "Disk protection is not operational; do not declare Emby monitoring complete."}
      - alert: EmbyTranscodeExporterMissing
        expr: absent(emby_transcode_collector_success{job="emby-transcode-exporter"}) or emby_transcode_collector_success{job="emby-transcode-exporter"} == 0
        for: 5m
        labels: {severity: critical, service: emby, node: pc6}
        annotations: {summary: "Emby transcode collector is missing or failing", description: "Read-only transcode performance monitoring is unavailable; no restart is permitted based on this signal."}
      - alert: EmbyTranscodeBelowRealtime
        expr: emby_transcode_speed_ratio{job="emby-transcode-exporter"} >= 0 and emby_transcode_speed_ratio{job="emby-transcode-exporter"} < 1
        for: 2m
        labels: {severity: warning, service: emby, node: pc6}
        annotations: {summary: "Emby transcoding is below realtime", description: "An active FFmpeg job is slower than realtime; alert only, no automatic restart or process termination."}
      - alert: EmbyTranscodeCriticallySlow
        expr: emby_transcode_speed_ratio{job="emby-transcode-exporter"} >= 0 and emby_transcode_speed_ratio{job="emby-transcode-exporter"} < 0.85
        for: 2m
        labels: {severity: critical, service: emby, node: pc6}
        annotations: {summary: "Emby transcoding is critically slow", description: "FFmpeg is below 0.85x realtime; inspect subtitle/overlay and active sessions. Do not restart while streaming."}
      - alert: EmbyTranscodeOverlayActive
        expr: emby_transcode_overlay_jobs{job="emby-transcode-exporter"} > 0
        for: 5m
        labels: {severity: warning, service: emby, node: pc6}
        annotations: {summary: "Emby transcode uses CPU overlay or hardware transfers", description: "Read-only diagnostic signal for hwdownload/hwupload/overlay pipeline."}
      - alert: TunarrUnavailable
        expr: probe_success{instance="http://10.0.0.123:8005/web/"} == 0
        for: 2m
        labels: {severity: warning, service: tunarr, node: pc6}
        annotations: {summary: "Tunarr CT250 is unavailable from PC9"}
      - alert: TunarrFeedUnavailable
        expr: probe_success{instance=~"http://10.0.0.(122|123):8005/api/(channels.m3u|xmltv.xml)"} == 0
        for: 5m
        labels: {severity: warning, service: tunarr}
        annotations: {summary: "A Tunarr feed is unavailable"}
      - alert: Pc6HostUnavailable
        expr: probe_success{instance=~"10.0.0.120:(22|8006)"} == 0
        for: 2m
        labels: {severity: critical, service: proxmox, node: pc6}
        annotations: {summary: "PC6 is unavailable from PC9"}
      - alert: Pc9ObservabilityComponentUnavailable
        expr: probe_success{instance=~"http://10.0.0.126:(9090/-/ready|9093/-/ready|9115/metrics)"} == 0
        for: 2m
        labels: {severity: warning, service: observability, node: pc9}
        annotations: {summary: "A PC9 observability component is unavailable"}
      # Proxmox guest rules are deduplicated by guest identity.
      - alert: GuestMemoryHigh
        expr: max by (name, node, type, vmid) ((proxmox_guest_mem_used_bytes{name!="pc6-vm201-unraid"} / proxmox_guest_mem_total_bytes{name!="pc6-vm201-unraid"}) * 100) >= 90
        for: 10m
        labels: {severity: warning, service: proxmox}
        annotations: {summary: "Proxmox guest memory usage is high"}
      - alert: GuestMemoryCritical
        expr: max by (name, node, type, vmid) ((proxmox_guest_mem_used_bytes{name!="pc6-vm201-unraid"} / proxmox_guest_mem_total_bytes{name!="pc6-vm201-unraid"}) * 100) >= 97
        for: 5m
        labels: {severity: critical, service: proxmox}
        annotations: {summary: "Proxmox guest memory usage is critical"}
      - alert: GuestDiskHigh
        expr: max by (name, node, type, vmid) ((proxmox_guest_disk_used_bytes / proxmox_guest_disk_total_bytes) * 100) >= 85
        for: 10m
        labels: {severity: warning, service: proxmox}
        annotations: {summary: "Proxmox guest disk usage is high"}
      - alert: GuestDiskCritical
        expr: max by (name, node, type, vmid) ((proxmox_guest_disk_used_bytes / proxmox_guest_disk_total_bytes) * 100) >= 90
        for: 5m
        labels: {severity: critical, service: proxmox}
        annotations: {summary: "Proxmox guest disk usage is critical"}
      - alert: GuestSustainedCPU
        expr: max by (name, node, type, vmid) (proxmox_guest_cpu_percent) >= 90
        for: 10m
        labels: {severity: info, service: proxmox}
        annotations: {summary: "Proxmox guest CPU usage is sustained"}
      - alert: OPNsenseCrashReporterActive
        expr: opnsense_crash_reporter_active{job="opnsense-crash-status"} == 1
        for: 2m
        labels: {severity: warning, service: opnsense, node: pc7}
        annotations:
          summary: "OPNsense reports a pending crash report"
          description: "Hermes detected an OPNsense crashreporter event. Inspect the firewall crash reporter and system logs before clearing it."
      - alert: OPNsenseStatusCollectorUnavailable
        expr: up{job="opnsense-crash-status"} == 0 or opnsense_status_sampler_up{job="opnsense-crash-status"} == 0
        for: 5m
        labels: {severity: warning, service: opnsense, node: pc7}
        annotations:
          summary: "OPNsense crash-status monitoring is unavailable"

      - alert: TunarrNfsHealthExporterUnavailable
        expr: up{job="tunarr-nfs-health"} == 0
        for: 3m
        labels: {severity: warning, service: tunarr, node: pc9}
        annotations:
          summary: "CT106 Tunarr NFS-health exporter is unavailable"
          description: "The passive stale-NFS health signal is unavailable. No automatic mount recovery is performed."
      - alert: TunarrNfsHealthMetricMissing
        expr: absent(tunarr_nfs_media_check_timestamp_seconds{job="tunarr-nfs-health"})
        for: 3m
        labels: {severity: warning, service: tunarr, node: pc9}
        annotations:
          summary: "CT106 Tunarr NFS-health metric is missing"
          description: "The checker has not published a mount-health timestamp. Inspect CT106 and Tower NFS before manual recovery."
      - alert: TunarrNfsMediaPathUnhealthy
        expr: tunarr_nfs_media_path_healthy{job="tunarr-nfs-health"} == 0
        for: 2m
        labels: {severity: warning, service: tunarr, node: pc9}
        annotations:
          summary: "A CT106 Tunarr NFS media path is unhealthy"
          description: "The passive file-stat check failed. This can indicate a stale NFS handle; inspect before any remount."
      - alert: TunarrNfsHealthCheckStalled
        expr: time() - tunarr_nfs_media_check_timestamp_seconds{job="tunarr-nfs-health"} > 180
        for: 2m
        labels: {severity: warning, service: tunarr, node: pc9}
        annotations:
          summary: "CT106 Tunarr NFS-health check is stalled"
          description: "A mount check has not completed for over three minutes. This may indicate a hard NFS operation is blocked; do not restart Emby."
