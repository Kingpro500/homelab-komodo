groups:
  - name: network-interface-health
    interval: 30s
    rules:
      - alert: NetworkInterfaceLinkDown
        expr: network_interface_link_up{interface="eth0"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "eth0 link is down"
          description: "eth0 has reported no carrier for more than 2 minutes."

      - alert: NetworkInterfaceRxDroppedRateHigh
        expr: rate(network_interface_rx_dropped_total{interface="eth0"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "eth0 RX-dropped rate is high"
          description: "eth0 is dropping more than 10 received packets/sec for 5 minutes."

      - alert: NetworkInterfaceRxDroppedRatioHigh
        expr: |
          rate(network_interface_rx_dropped_total{interface="eth0"}[5m])
          /
          clamp_min(rate(network_interface_rx_packets_total{interface="eth0"}[5m]), 1)
          > 0.001
          and rate(network_interface_rx_dropped_total{interface="eth0"}[5m]) > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "eth0 RX-drop ratio is high"
          description: "More than 0.1% of received packets have been dropped for 5 minutes."

  - name: correlated-wan-health
    interval: 15s
    rules:
      - alert: OPNsenseGatewayPathFailure
        expr: |
          probe_success{job="blackbox-wan-icmp-pc9",instance="10.0.0.1"} == 0
          and on() sum(probe_success{job="blackbox-wan-icmp-pc9",instance=~"1.1.1.1|9.9.9.9"} == 1) == 2
        for: 15m
        labels:
          severity: critical
          scope: local-gateway
        annotations:
          summary: "OPNsense gateway path fails while the Internet remains reachable"
          description: "PC9 cannot reach OPNsense over ICMP, but both external ICMP targets are healthy. Investigate OPNsense, LAN path or NIC—not the ISP."

      - alert: OPNsenseDnsFailure
        expr: |
          probe_success{job="blackbox-wan-dns-pc9",instance="10.0.0.1:53"} == 0
          and on() sum(probe_success{job="blackbox-wan-dns-pc9",instance=~"1.1.1.1:53|9.9.9.9:53"} == 1) == 2
        for: 15m
        labels:
          severity: warning
          scope: local-dns
        annotations:
          summary: "OPNsense DNS fails while public DNS is healthy"
          description: "This is isolated to the local resolver path, not a general WAN outage."

      - alert: ExternalDnsDegraded
        expr: sum(probe_success{job="blackbox-wan-dns-pc9",instance=~"1.1.1.1:53|9.9.9.9:53"} == 0) >= 2
        for: 15m
        labels:
          severity: warning
          scope: external-dns
        annotations:
          summary: "Both independent public DNS probes fail"
          description: "Cloudflare and Quad9 DNS both fail from PC9 for at least 30 seconds. Check WAN and upstream DNS."

      - alert: ExternalWanPathFailure
        expr: sum(probe_success{job="blackbox-wan-icmp-pc9",instance=~"1.1.1.1|9.9.9.9"} == 0) >= 2
        for: 15m
        labels:
          severity: critical
          scope: wan-or-isp
        annotations:
          summary: "Both independent Internet ICMP probes fail"
          description: "PC9 cannot reach Cloudflare or Quad9 for at least 30 seconds. Correlate with Hermes gateway and NIC samples for WAN/ISP diagnosis."
