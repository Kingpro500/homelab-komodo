groups:
  - name: media-services
    rules:
      - alert: MediaServicesCTDown
        expr: proxmox_guest_up{vmid="210"} == 0
        for: 5m
        labels: {severity: warning, service: media-services, node: pc6}
        annotations:
          summary: "CT210 media-services er stoppet"
          description: "PC6 CT210 (Sonarr, Radarr, Prowlarr, Bazarr, Readarr, Deluge, Seerr) har vært stoppet i 5 minutter. Sjekk /var/log/pc6-resource-guard.log på PC6 og Proxmox task-loggen for hvem som stoppet den."
      - alert: MediaServiceDown
        expr: probe_success{job="blackbox-media-services"} == 0 and on() (proxmox_guest_up{vmid="210"} == 1)
        for: 5m
        labels: {severity: warning, service: media-services, node: pc6}
        annotations:
          summary: "{{ $labels.app }} svarer ikke ({{ $labels.instance }})"
          description: "CT210 kjører, men {{ $labels.app }} har ikke svart på TCP i 5 minutter."
      - alert: MediaServicesGuestMetricMissing
        expr: absent(proxmox_guest_up{vmid="210"})
        for: 10m
        labels: {severity: warning, service: media-services, node: pc6}
        annotations:
          summary: "Ingen status for CT210 fra homelab-exporter"
          description: "Overvåkingen av CT210 virker ikke; sjekk homelab-exporter på 10.0.0.135:9120."
