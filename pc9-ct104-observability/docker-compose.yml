services:
  network-interface-exporter:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python3", "/opt/network-exporter/network_interface_exporter.py"]
    environment:
      NETWORK_EXPORTER_INTERFACES: "eth0"
      NETWORK_EXPORTER_PORT: "9122"
    ports: ["9122:9122"]
    volumes:
      - ./scripts/network_interface_exporter.py:/opt/network-exporter/network_interface_exporter.py:ro

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/config.yml"]
    ports: ["9115:9115"]
    cap_add: [NET_RAW]
    volumes:
      - ./config/blackbox.yml:/etc/blackbox/config.yml:ro

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports: ["9093:9093"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=12GB
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./config/network-alerts.yml:/etc/prometheus/network-alerts.yml:ro
      - ./config/tunarr-session-alerts.yml:/etc/prometheus/tunarr-session-alerts.yml:ro
      - ./scripts/network_interface_exporter.py:/opt/network-exporter/network_interface_exporter.py:ro
      - prometheus-data:/prometheus
    depends_on: [blackbox, alertmanager]

volumes:
  prometheus-data:
  alertmanager-data:
