global:
  resolve_timeout: 5m
route:
  receiver: n8n-homelab-alerts
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: n8n-homelab-alerts
    webhook_configs:
      - url: http://10.0.0.119:5678/webhook/homelab-alerts
        send_resolved: true
