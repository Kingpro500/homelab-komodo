services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3009:3000"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 10.0.0.124:3009
    volumes:
      - ../homepage/config:/app/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
