# Monitoring services on pc6 CT120 (10.0.0.124)
services:
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    ports: ["9115:9115"]
    cap_add: ["NET_RAW"]
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - /opt/monitoring/pc6-ct109-prometheus/config/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    env_file: /opt/monitoring/speedtest.env
    ports: ["8765:80"]
    volumes:
      - /opt/speedtest-tracker:/config
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports: ["9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=5y
      - --storage.tsdb.retention.size=8GB
    volumes:
      - /opt/monitoring/pc6-ct109-prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/monitoring/pc6-ct109-prometheus_prometheus-data/_data:/prometheus
      - /opt/monitoring/pc6-ct109-prometheus/config/alerts.yml:/etc/prometheus/alerts.yml:ro
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports: ["9093:9093"]
    volumes:
      - /opt/monitoring/464ca9b4b594ebed17e28165da1d2a47345ec616a677ecdb445c5dc099d7b5ec/_data:/alertmanager
      - /opt/monitoring/pc6-ct109-prometheus/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
