# Monitoring services on pc6 CT120 (10.0.0.124).
# Prometheus and Alertmanager run on pc9; CT120 only provides blackbox and speedtest.
services:
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    ports: ["9115:9115"]
    cap_add: ["NET_RAW"]
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ../pc9-ct104-observability/config/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    env_file: /opt/monitoring/speedtest.env
    ports: ["8765:80"]
    volumes:
      - /opt/speedtest-tracker:/config
    restart: unless-stopped
