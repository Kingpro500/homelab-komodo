server:
  port: 8080

branding:
  app-name: Homelab
  logo-text: H
  hide-footer: true

theme:
  background-color: 220 18 11
  primary-color: 210 70 55
  positive-color: 150 45 45
  negative-color: 2 75 60
  contrast-multiplier: 1.15

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Europe/Oslo
                label: Oslo

          - type: calendar
            first-day-of-week: monday

          - type: search
            search-engine: duckduckgo
            bangs:
              - title: Komodo
                shortcut: "!komodo"
                url: http://10.0.0.117:9120/
              - title: Proxmox pc8
                shortcut: "!pve"
                url: https://10.0.0.102:8006/

          - type: http
            title: OpenRouter Spend
            url: http://10.0.0.135:9118/openrouter/spend
            cache: 5m
            fields:
              - title: Total Cost ($)
                label: total_cost
                color: "#FF6B6B"
              - title: Requests
                label: total_requests
                color: "#4ECDC4"
              - title: Weekly Avg
                label: weekly_avg
                color: "#95E1D3"

      - size: full
        widgets:
          - type: monitor
            title: Tjenester
            cache: 1m
            style: compact
