# ComfyUI (Dark Beast Krea 2 v3) på pc1. GPU delt med de andre pc1-CT-ene: kjør bare én generator om gangen.
# Alt tungt (ComfyUI, venv, modeller, output) ligger på Tower via /models; ingenting committes.
services:
  comfyui:
    image: python:3.12-slim
    container_name: comfyui
    restart: unless-stopped
    ports:
      - "8188:8188"
      - "7860:7860"
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
    volumes:
      - /models:/models
      - ./app.py:/models/viewer/app.py:ro
      - ./page.html:/models/viewer/page.html:ro
      - /usr/lib/x86_64-linux-gnu/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so.1:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
    working_dir: /models
    environment:
      UNET: darkBeast330_int8convrot_heur.safetensors
      TE: qwen3vl_4b_fp8_scaled.safetensors
      VAE: qwen_image_vae.safetensors
      TITLE: "Dark Beast Krea 2 v3"
      TMPDIR: /models/tmp
      PIP_CACHE_DIR: /models/pipcache
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    entrypoint: ["/bin/sh", "/models/start.sh"]
