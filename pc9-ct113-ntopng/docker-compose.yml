services:
  ntopng:
    image: ntop/ntopng:latest
    container_name: ntopng
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    command:
      - --community
      - --interface=eth0
      - --http-port=3000
      - --local-networks=10.0.0.0/24
    volumes:
      - /opt/ntopng/data:/var/lib/ntopng
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  smokeping:
    image: lscr.io/linuxserver/smokeping:latest
    container_name: smokeping
    hostname: smokeping
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Oslo
    ports:
      - "3001:80"
    volumes:
      - /opt/smokeping/config:/config
      - /opt/smokeping/data:/data
      - ./smokeping/Targets:/config/Targets
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
