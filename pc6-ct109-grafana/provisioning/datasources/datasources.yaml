# Grafana datakilde for Netdata, via Prometheus-broen.
#
# Netdata kan IKKE mates direkte til Grafana (plugin fjernet fra registeret,
# og /api/v1/allmetrics er et export-endepunkt, ikke et PromQL API). Derfor
# skraper pc6-ct109-prometheus de fire Netdata-nodene, og denne kilden spør
# Prometheus — som implementerer PromQL.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://10.0.0.128:9090
    orgName: "Main Org"
    basicAuth: false
    isDefault: true