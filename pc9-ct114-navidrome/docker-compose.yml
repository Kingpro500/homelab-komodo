services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    user: "${NAVIDROME_UID:-1000}:${NAVIDROME_GID:-1000}"
    environment:
      ND_LOGLEVEL: "info"
      ND_SCANSCHEDULE: "1h"
      ND_SESSIONTIMEOUT: "24h"
      ND_BASEURL: ""
      TZ: "${TZ:-Europe/Oslo}"
      # Scrobbling til Koito (pc9-ct114-scrobbling) via ListenBrainz-API. Kobles per bruker
      # i Navidrome: Personal -> ListenBrainz -> lim inn Koito API-nøkkel (KOITO_TOKEN).
      ND_LISTENBRAINZ_ENABLED: "true"
      ND_LISTENBRAINZ_BASEURL: "http://10.0.0.172:4110/apis/listenbrainz/1/"
    ports:
      - "4533:4533"
    volumes:
      - "${NAVIDROME_DATA_PATH:-/opt/navidrome/data}:/data"
      - "${NAVIDROME_MUSIC_PATH:-/opt/navidrome/music}:/music:ro"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4533/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
