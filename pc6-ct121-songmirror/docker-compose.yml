services:
  songmirror:
    image: ghcr.io/ahnafnafee/songmirror:latest
    container_name: songmirror
    restart: unless-stopped
    ports:
      - "8888:8080"
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      SONGMIRROR_DATA_DIR: /data
      SONGMIRROR_ENV_FILE: /data/app.env
      SONGMIRROR_DOWNLOAD_DIR: /music
      SPOTIFY_OAUTH_OPEN_BROWSER: "0"
    volumes:
      - /opt/songmirror/data:/data
      - /opt/songmirror/music:/music
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Daily world-chart playlists + "last 200 liked" in Spotify.
  # Reads charts from Apple Music and writes to Spotify through the web sessions
  # stored by SongMirror (mounted read-only). Only touches playlists it created.
  toplister:
    image: ghcr.io/ahnafnafee/songmirror:latest
    container_name: songmirror-toplister
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    entrypoint: ["/app/.venv/bin/python", "/opt/toplister/toplister.py"]
    environment:
      TZ: Europe/Oslo
      PYTHONPATH: /app
      SONGMIRROR_DATA: /sm
      STATE_DIR: /state
      RUN_AT: "06:30"
      RUN_ON_START: "1"
    volumes:
      - /opt/songmirror/data:/sm:ro
      - /opt/songmirror/toplister/state:/state
      - ./toplister:/opt/toplister:ro
    healthcheck:
      disable: true

  # Follows renames/deletions of the "Finpuss" playlists in Spotify (by playlist id)
  # and keeps the SongMirror sync job and the Apple copies in step. See
  # toplister/finpuss_vakt.py.
  finpuss-vakt:
    image: ghcr.io/ahnafnafee/songmirror:latest
    container_name: songmirror-finpuss-vakt
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    entrypoint: ["/app/.venv/bin/python", "/opt/toplister/finpuss_vakt.py"]
    environment:
      TZ: Europe/Oslo
      PYTHONPATH: /app
      SONGMIRROR_DATA: /sm
      STATE_DIR: /state
      SONGMIRROR_URL: http://songmirror:8080
      JOB_ID: 9a81dcc0
      INTERVAL_S: "300"
    volumes:
      - /opt/songmirror/data:/sm:ro
      - /opt/songmirror/toplister/state:/state
      - ./toplister:/opt/toplister:ro
    depends_on:
      - songmirror
    healthcheck:
      disable: true
