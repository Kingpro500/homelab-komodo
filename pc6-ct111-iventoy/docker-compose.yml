services:
  iventoy:
    image: ziggyds/iventoy:latest
    container_name: iventoy
    restart: unless-stopped
    privileged: true
    ports:
      - "26000:26000"
      - "16000:16000"
      - "10809:10809"
      - "67:67/udp"
      - "69:69/udp"
    volumes:
      - /iso:/app/iso
      - /opt/iventoy/data:/app/data
      - /opt/iventoy/log:/app/log
      # iVentoy derives its local identity from this host value.
      - /sys/class/dmi/id/product_uuid:/app/data/sys/class/dmi/id/product_uuid:ro
    environment:
      AUTO_START_PXE: "true"
