version: '3.8'

services:
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2
    container_name: komodo-periphery
    restart: unless-stopped
    init: true
    ports:
      - "9121:9121"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Lar Periphery styre Docker på verten
      - periphery_keys:/config/keys

volumes:
  periphery_keys:

