version: "3.8"

services:
  komodo-core:
    image: ghcr.io/moghtech/komodo-core:2
    container_name: komodo-core-1
    restart: unless-stopped
    init: true
    ports:
      - "9120:9120"
    environment:
      - KOMODO_DB_URI=mongodb://root:mongopassword@komodo-mongodb:27017/komodo?authSource=admin
      - KOMODO_INIT=true
    volumes:
      - komodo_keys:/config/keys
    depends_on:
      - komodo-mongodb
    networks:
      - komodo_network

  komodo-mongodb:
    image: mongo:6.0
    container_name: komodo-mongodb-1
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=mongopassword
    volumes:
      - komodo_mongo_data:/data/db
    networks:
      - komodo_network

  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2
    container_name: komodo-periphery-1
    restart: unless-stopped
    init: true
    volumes:
      - komodo_keys:/config/keys
    networks:
      - komodo_network

networks:
  komodo_network:
    name: komodo_default

volumes:
  komodo_keys:
    name: komodo_keys
  komodo_mongo_data:
    name: komodo_mongo_data

