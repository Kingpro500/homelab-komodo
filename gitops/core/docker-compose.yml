version: '3.8'

services:
  database:
    image: mongo:7.0
    container_name: komodo-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db

  core:
    image: ghcr.io/moghtech/komodo-core:2
    container_name: komodo-core
    restart: unless-stopped
    init: true
    depends_on:
      - database
    ports:
      - "9120:9120"
    environment:
      # Tilkoblingsstreng til den lokale MongoDB-containeren
      KOMODO_MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@database:27017/?authSource=admin
    volumes:
      - core_keys:/config/keys
      - core_data:/config/periphery # Valgfritt: For lokal lagring/state

volumes:
  mongo_data:
  core_keys:
  core_data:

