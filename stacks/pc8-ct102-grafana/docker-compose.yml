version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: grafana-postgres
    environment:
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: grafana_secure_password_change_me
      POSTGRES_DB: grafana
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - grafana

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-app
    depends_on:
      - postgres
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: grafana_secure_password_change_me
      GF_SERVER_ROOT_URL: http://10.0.0.117:3000
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - grafana

volumes:
  postgres_data:
  grafana_storage:

networks:
  grafana:
    driver: bridge
