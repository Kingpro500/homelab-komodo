version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netbox-postgres
    environment:
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox_secure_password_change_me
      POSTGRES_DB: netbox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - netbox

  redis:
    image: redis:7-alpine
    container_name: netbox-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - netbox

  netbox:
    image: netboxcommunity/netbox:latest
    container_name: netbox-app
    depends_on:
      - postgres
      - redis
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox_secure_password_change_me
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB_TASKS: 0
      REDIS_DB_CACHE: 1
      SECRET_KEY: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijk
      ALLOWED_HOSTS: "*"
      SUPERUSER_USERNAME: admin
      SUPERUSER_PASSWORD: admin
      SUPERUSER_EMAIL: admin@netbox.local
      TIME_ZONE: UTC
    ports:
      - "8001:8080"
    volumes:
      - netbox_config:/etc/netbox/config
      - netbox_media:/opt/netbox/netbox/media
    restart: unless-stopped
    networks:
      - netbox

volumes:
  postgres_data:
  redis_data:
  netbox_config:
  netbox_media:

networks:
  netbox:
    driver: bridge
