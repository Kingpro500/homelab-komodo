services:
  postgres:
    image: postgres:16-alpine
    container_name: netbox-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-netbox}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - netbox

  redis:
    image: redis:7-alpine
    container_name: netbox-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - netbox

  netbox:
    image: netboxcommunity/netbox:latest
    container_name: netbox-app
    depends_on:
      - postgres
      - redis
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-netbox}
      DB_USER: ${POSTGRES_USER:-netbox}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB_TASKS: 0
      REDIS_DB_CACHE: 1
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      SUPERUSER_USERNAME: ${SUPERUSER_USERNAME:-admin}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:?Set SUPERUSER_PASSWORD in .env}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-admin@netbox.local}
      TIME_ZONE: ${TIME_ZONE:-UTC}
    ports:
      - "8001:8080"
    volumes:
      - netbox_config:/etc/netbox/config
      - netbox_media:/opt/netbox/netbox/media
    restart: unless-stopped
    networks:
      - netbox

  # NetBox sends background and scheduled jobs to Redis. The web container
  # does not consume that queue, so it needs a dedicated RQ worker.
  netbox-worker:
    image: netboxcommunity/netbox:latest
    container_name: netbox-worker
    depends_on:
      - postgres
      - redis
      - netbox
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-netbox}
      DB_USER: ${POSTGRES_USER:-netbox}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Komodo}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB_TASKS: 0
      REDIS_DB_CACHE: 1
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in Komodo}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      TIME_ZONE: ${TIME_ZONE:-UTC}
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    restart: unless-stopped
    networks:
      - netbox

volumes:
  postgres_data:
  redis_data:
  netbox_config:
  netbox_media:

networks:
  netbox:
    driver: bridge
