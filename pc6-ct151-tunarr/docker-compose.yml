# Tunarr colocated with Emby on CT151. SSDP/UDP 1900 is omitted because Emby
# owns it on this host; the saved Emby connection is migrated with /config.
services:
  tunarr:
    image: ghcr.io/chrisbenincasa/tunarr:latest
    container_name: tunarr
    restart: unless-stopped
    ports:
      - "8005:8000"
    volumes:
      - "${TUNARR_CONFIG_PATH:-/opt/tunarr/config}:/config"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    # Initialising the copied search index exceeds the previous CT109 limit.
    mem_limit: 4g
