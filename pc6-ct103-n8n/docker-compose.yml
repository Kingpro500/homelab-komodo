services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD}
    volumes:
      - /opt/n8n/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mongo-kompatibel hendelseslogg for n8n. Backend er postgres over.
  # n8n kobler til mongodb://ferretdb:27017/homelab_events (MySQL/MariaDB
  # er inkompatibelt med Debian 13/Proxmox — derfor FerretDB, se docs).
  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:1
    container_name: n8n-ferretdb
    restart: unless-stopped
    command:
      - "--postgresql-url=postgres://n8n:${N8N_POSTGRES_PASSWORD}@postgres:5432/homelab_events"
      - "--listen-addr=0.0.0.0:27017"
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      N8N_HOST: 10.0.0.119
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      # LAN-only access until n8n is placed behind HTTPS.
      N8N_SECURE_COOKIE: "false"
      N8N_EDITOR_BASE_URL: http://10.0.0.119:5678
      WEBHOOK_URL: http://10.0.0.119:5678
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
    volumes:
      - /opt/n8n/data:/home/node/.n8n
