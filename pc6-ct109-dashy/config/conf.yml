---
# Starter config for Dashy 4.7. Runtime copy lives at /opt/dashy/conf.yml on
# CT109. Dashy 4.7 uses the sections/items format; appConfig replaces the old
# top-level `settings` block.
pageInfo:
  title: Homelab Dashy
  description: pc6 CT109
  navLinks:
    - title: Glance
      path: http://10.0.0.128:3010/
      target: newtab
    - title: Heimdall
      path: http://10.0.0.128:3012/
      target: newtab
    - title: Homepage
      path: http://10.0.0.128:3009/
      target: newtab

appConfig:
  layout: masonry
  allowConfigEdit: true
  language: nb
  iconSize: medium
  nightTheme: callisto
  enableMaterialDesignIcons: true

