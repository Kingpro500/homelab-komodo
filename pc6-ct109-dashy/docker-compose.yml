services:
  dashy:
    image: lissy93/dashy:4.7.17
    container_name: dashy
    restart: unless-stopped
    ports:
      - "3011:8080"
    environment:
      TZ: Europe/Oslo
    volumes:
      # Named volume: Docker creates it on first deploy, so nothing has to be
      # prepared on the host by hand. conf.yml here is edited from the Dashy UI.
      - dashy-data:/usr/src/app/data

volumes:
  dashy-data: