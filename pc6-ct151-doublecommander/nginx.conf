# TLS reverse proxy for Double Commander (Selkies). Terminates HTTPS on :8099
# with a fixed self-signed cert so it works from the LAN regardless of SNI,
# then proxies (with WebSocket upgrade for Selkies) to the app on :3000.
server {
    listen 8099 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_pass         http://doublecommander:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
    }
}
