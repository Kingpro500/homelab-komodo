# Krusader on CT 151 (emby-pc6)
#
# KDE twin-pane file manager over the Unraid media NFS share, in the browser
# via jlesage's reliable noVNC container (chose over binhex/arch-krusader for
# stability — a KDE-in-browser container broke here before).
#
# Runs on the same privileged container as Emby. The app runs as root inside
# the container, and Unraid's NFS root_squash maps that to uid 99 (nobody), so
# files are written with the same owner as the rest of the media share.
#
# Deploy through Komodo on the emby-pc6 server with these Stack variables
# (all optional; defaults shown):
#
#   KRUSADER_MEDIA_PATH=/media   # CT path of the Unraid media NFS (mp0)
#   KRUSADER_CONFIG_PATH=/opt/krusader
#   TZ=Europe/Oslo
#
# Before the first deployment, prepare the config dir on CT 151:
#
#   install -d -o 0 -g 0 -m 0755 /opt/krusader
#
# Web UI is published on port 8098: http://10.0.0.150:8098
# The KDE desktop is reachable there; open Krusader from the menu and it can
# navigate the container (mounts /media).
services:
  krusader:
    image: jlesage/krusader:latest
    container_name: krusader
    restart: unless-stopped
    ports:
      - "8098:5800"          # web UI (noVNC)
    environment:
      TZ: "${TZ:-Europe/Oslo}"
      DISPLAY_WIDTH: "${KRUSADER_WIDTH:-1920}"
      DISPLAY_HEIGHT: "${KRUSADER_HEIGHT:-1080}"
    volumes:
      - "${KRUSADER_CONFIG_PATH:-/opt/krusader}:/config"
      - "${KRUSADER_MEDIA_PATH:-/media}:/media"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
