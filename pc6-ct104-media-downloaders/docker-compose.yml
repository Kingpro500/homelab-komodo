# MeTube on Proxmox CT120 (pc6).
# Pinchflat moved to the dedicated pc6-ct172-pinchflat stack.
services:
  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: metube
    ports:
      - "8081:8081"
    environment:
      TZ: "${TZ:-Europe/Oslo}"
    volumes:
      - "${TOWER_MEDIA_PATH:?Set TOWER_MEDIA_PATH in Komodo}/metube:/downloads"
      - "${METUBE_COOKIES_PATH:?Set METUBE_COOKIES_PATH in Komodo}:/cookies"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
