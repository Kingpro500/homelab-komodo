version: '3.8'

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 3009:3000
    environment:
      PUID: 65534
      PGID: 65534
    volumes:
      - /mnt/user/media/z_data/komodo-configs/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
