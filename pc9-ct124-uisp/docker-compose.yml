services:
  uisp:
    image: nico640/docker-unms:3.1.70
    container_name: uisp
    restart: unless-stopped
    environment:
      TZ: Europe/Oslo
      PUBLIC_HTTPS_PORT: "443"
      PUBLIC_WS_PORT: "443"
    ports:
      - "80:80"
      - "443:443"
      - "2055:2055/udp"
    volumes:
      - ./data:/config
