# Intern statisk webside: nettverkskartet (Komodo-stack pc6-ct120-web på CT120).
#
# Kartet ligger IKKE i dette GitHub-repoet. Kilden er Gitea-kopien på CT120
# (/opt/moved-services/nettkart-repo/docs/network-map/), og den publiseres med
# /usr/local/sbin/nettkart-publish til webroten /srv/nettkart/www på CT120.
# Webroten ligger bevisst UTENFOR Komodo sin Git-checkout, slik at en
# PullStack/DeployStack aldri kan overskrive eller slette det levende kartet.
#
# Denne stacken leverer nginx + default.conf, Oslo Børs-siden (oslo-bors.html) og nyhetssiden /nyheter (nyheter/) fra GitHub. LAN-alene (ingen WAN-portforward).
services:
  nettkart:
    image: nginx:alpine
    container_name: nettkart
    restart: unless-stopped
    ports:
      - "3020:80"
    volumes:
      - /srv/nettkart/www:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      # Oslo Børs (C64-emulator): kilde i GitHub, ikke i Gitea. Egen mappe utenfor kart-webroten.
      - ./oslo-bors.html:/usr/share/nginx/oslo/oslo-bors.html:ro
      # Nyheter: siden fra GitHub, data.json fra nyheter-containeren (eget volum).
      - ./nyheter/index.html:/usr/share/nginx/nyheter/index.html:ro
      - nyheter-data:/usr/share/nginx/nyheter-data:ro

  # Henter toppsaker per land (Google News) + dine aviser (RSS), oversetter
  # overskrifter til norsk og skriver data.json. Land og aviser: nyheter/feeds.json.
  nyheter:
    image: python:3.13-alpine
    container_name: nyheter
    restart: unless-stopped
    command: ["python", "-u", "/app/fetch.py"]
    environment:
      TZ: Europe/Oslo
      INTERVAL: "1800"
    mem_limit: 256m
    volumes:
      - ./nyheter:/app:ro
      - nyheter-data:/data

volumes:
  nyheter-data:
