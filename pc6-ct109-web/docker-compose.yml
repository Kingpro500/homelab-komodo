# Intern statisk webside: nettverkskartet (Komodo-stack pc6-ct120-web på CT120).
#
# Kartet ligger IKKE i dette GitHub-repoet. Kilden er Gitea-kopien på CT120
# (/opt/moved-services/nettkart-repo/docs/network-map/), og den publiseres med
# /usr/local/sbin/nettkart-publish til webroten /srv/nettkart/www på CT120.
# Webroten ligger bevisst UTENFOR Komodo sin Git-checkout, slik at en
# PullStack/DeployStack aldri kan overskrive eller slette det levende kartet.
#
# Denne stacken leverer bare nginx + default.conf. LAN-alene (ingen WAN-portforward).
services:
  nettkart:
    image: nginx:alpine
    container_name: nettkart
    restart: unless-stopped
    ports:
      - "3020:80"
    volumes:
      - /srv/nettkart/www:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
