# nginx config for the internal network-map site.
# Serves nettverkskart.html as the index at the root URL.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index nettverkskart.html index.html;

    location = /oslo-bors { return 302 /oslo-bors.html; }
    # Oslo Børs (C64) serveres fra GitHub-kilden, ikke fra kart-webroten (Gitea).
    location = /oslo-bors.html { root /usr/share/nginx/oslo; }

    # Nyhetssiden: HTML fra GitHub (nyheter/index.html), data fra nyheter-containeren.
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;
    location = /nyheter { return 302 /nyheter/; }
    location = /nyheter/data.json { alias /usr/share/nginx/nyheter-data/data.json; add_header Cache-Control "no-cache"; }
    location /nyheter/ { alias /usr/share/nginx/nyheter/; index index.html; }

    location / {
        try_files $uri $uri/ /nettverkskart.html;
    }
}
