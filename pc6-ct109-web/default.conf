# nginx config for the internal network-map site.
# Serves nettverkskart.html as the index at the root URL.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index nettverkskart.html index.html;

    location = /oslo-bors { return 302 /oslo-bors.html; }
    # Oslo Børs (C64) serveres fra GitHub-kilden, ikke fra kart-webroten (Gitea).
    location = /oslo-bors.html { root /usr/share/nginx/oslo; }

    location / {
        try_files $uri $uri/ /nettverkskart.html;
    }
}
