<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nyheter – land og tema</title>
<style>
:root{--bg:#0f1115;--card:#161920;--line:#252a35;--text:#e6e8ef;--dim:#878fa3;--accent:#7dcfff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:2;background:rgba(15,17,21,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:6px 12px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
.meta{color:var(--dim);font-size:12px}
.meta a,a.meta{color:var(--accent)}
nav a{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
nav a:hover{border-color:var(--accent)}
nav a.tema{border-style:dashed}
#rnd{cursor:pointer;font:600 12px system-ui;background:#2b3b5a;color:var(--text);border:1px solid var(--accent);border-radius:6px;padding:3px 10px;margin-right:6px}
#rnd:hover{background:#34507d}
#rndbox{display:none;position:fixed;top:70px;right:16px;z-index:5;max-width:520px;background:var(--card);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;box-shadow:0 6px 24px #000a}
#rndbox li{white-space:normal;margin:4px 0}
#rndbox .x{float:right;cursor:pointer;color:var(--dim)}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-right:6px}
.tabs b{cursor:pointer;font-weight:500;font-size:12px;padding:2px 10px;color:var(--dim)}
.tabs b.on{background:#24324a;color:var(--text)}
body.v-land section.k-tema,body.v-tema section.k-land,body.v-land nav a.tema,body.v-tema nav a.land{display:none}
.ctl{margin-top:4px;font-size:12px;color:var(--dim)}
.chip{cursor:pointer;user-select:none;display:inline-block;font-size:11px;border-radius:999px;padding:0 7px;border:1px solid currentColor;margin-right:3px}
.chip.off{opacity:.3;text-decoration:line-through}
.ctl label{cursor:pointer;margin-left:10px}
main{display:flex;gap:10px;align-items:flex-start;padding:10px 12px 30px}
.col{flex:1 1 0;min-width:0}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px 8px;margin:0 0 10px;scroll-margin-top:90px}
h2{font-size:14px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;cursor:pointer}
h2 small{color:var(--dim);font-weight:400;font-size:11px}
section.shut > :not(h2){display:none}
section.shut h2{margin:0}
ol,ul{margin:0;padding-left:18px}
li{margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.wrap li{white-space:normal}
.t{display:inline-block;min-width:26px;color:var(--dim);font-size:11px;margin-right:4px;text-align:right}
ol,ul{list-style:none;padding-left:0!important}
li.extra{display:none}
section.open li.extra{display:list-item}
li a{font-weight:550}
li a:visited{color:#a8a2c2}
li a:hover{color:var(--accent);text-decoration:underline}
.m{color:var(--dim);font-size:11px;font-weight:400;white-space:nowrap}
.orig{display:none;color:var(--dim);font-size:11px;font-style:italic}
body.showorig .orig{display:block}
button.more{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:12px}
.err{color:#e0af68;font-size:11px;margin:2px 0}
.papers{margin-top:6px;border-top:1px solid var(--line);padding-top:4px}
.paper{margin-top:4px}
.paper h3{font-size:12px;margin:0;font-weight:600;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.paper h3 a{color:var(--accent)}
.paper ul{padding-left:16px}
.paper li{margin:1px 0 2px}
.paper li a{font-weight:450}
body.pp2 .paper li:nth-child(n+3),body.pp3 .paper li:nth-child(n+4),body.pp5 .paper li:nth-child(n+6){display:none}
.ctl select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:4px;font-size:12px}
.via{color:var(--dim);font-size:10px;font-weight:400}
.lean{display:inline-block;font-size:10px;font-weight:500;border-radius:999px;padding:0 6px;border:1px solid currentColor;line-height:1.5}
.l-ytre-venstre{color:#ff5c7a}.l-venstre{color:#ff9e9e}.l-sentrum{color:#c0caf5}.l-høyre{color:#7aa2f7}.l-ytre-høyre{color:#2f7bff}
.l-allmenn{color:#9ece6a}.l-statlig{color:#e0af68}.l-opposisjon{color:#bb9af7}.l-ukjent{color:#6b7280}
.hide-ytre-venstre .paper.l-ytre-venstre,.hide-venstre .paper.l-venstre,.hide-sentrum .paper.l-sentrum,.hide-høyre .paper.l-høyre,
.hide-ytre-høyre .paper.l-ytre-høyre,.hide-allmenn .paper.l-allmenn,.hide-statlig .paper.l-statlig,.hide-opposisjon .paper.l-opposisjon{display:none}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>📰 Nyheter</h1>
    <button id="rnd" title="Åpner 5 tilfeldige saker fra det som vises nå (tillat sprettoppvinduer for 10.0.0.124 første gang)">🎲 5 tilfeldige</button>
    <span class="tabs" id="tabs"><b data-v="alle">Alle</b><b data-v="land">Land</b><b data-v="tema">Tema</b></span>
    <nav class="row" id="nav"></nav>
  </div>
  <div class="ctl">
    <span id="meta">Laster …</span> · <a class="meta" href="/">← Nettverkskartet</a>
    <span style="margin-left:10px">Ståsted (klikk for å skjule):</span> <span id="chips"></span>
    <label><input type="checkbox" id="optWrap"> hele titler</label>
    <label><input type="checkbox" id="optOrig"> vis originaltekst</label>
    <label>saker per avis <select id="optPP"><option>2</option><option>3</option><option>5</option><option>10</option></select></label>
    <label><input type="checkbox" id="optShut"> lukk alle land</label>
  </div>
</header>
<div id="rndbox"><span class="x" onclick="this.parentNode.style.display='none'">✕</span><b>🎲 Tilfeldige saker</b><ul id="rndlist"></ul><div class="meta" id="rndnote"></div></div>
<main id="main"></main>
<script>
const SHOW = 5;
const LEANS = ["ytre venstre","venstre","sentrum","høyre","ytre høyre","allmenn","statlig","opposisjon"];
const TRANSLATED_FROM = {fi:"finsk",de:"tysk",fr:"fransk",it:"italiensk",es:"spansk",el:"gresk",hu:"ungarsk",he:"hebraisk",fa:"persisk",tr:"tyrkisk",ru:"russisk"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cls = s => String(s || "ukjent").replace(/ /g, "-");
const store = (k, v) => v === undefined ? JSON.parse(localStorage.getItem("nyh-" + k) || "null") : localStorage.setItem("nyh-" + k, JSON.stringify(v));
function ago(iso){
  if(!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (isNaN(m)) return "";
  if (m < 60) return Math.max(m,1) + " m";
  if (m < 48*60) return Math.round(m/60) + " t";
  return Math.round(m/1440) + " d";
}
const open = new Set(store("open") || []);
const shut = new Set(store("shut") || []);
const hidden = new Set(store("hidden") || []);
function applyPrefs(){
  document.body.className = ["v-" + (store("view") || "alle"), store("orig") ? "showorig" : "", store("wrap") ? "wrap" : "", "pp" + (store("pp") || (store("three") ? 3 : 2)), ...[...hidden].map(l => "hide-" + cls(l))].join(" ");
  document.getElementById("optOrig").checked = !!store("orig");
  document.getElementById("optWrap").checked = !!store("wrap");
  document.getElementById("optPP").value = String(store("pp") || (store("three") ? 3 : 2));
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("off", hidden.has(c.dataset.l)));
  document.querySelectorAll(".tabs b").forEach(b => b.classList.toggle("on", b.dataset.v === (store("view") || "alle")));
}
document.getElementById("chips").innerHTML = LEANS.map(l => `<span class="chip l-${cls(l)}" data-l="${l}">${l}</span>`).join("");
document.getElementById("chips").onclick = e => {
  const l = e.target.dataset?.l; if (!l) return;
  hidden.has(l) ? hidden.delete(l) : hidden.add(l); store("hidden", [...hidden]); applyPrefs(); relayout();
};
document.getElementById("tabs").onclick = e => { const v = e.target.dataset?.v; if (!v) return; store("view", v); applyPrefs(); relayout(); };
document.getElementById("optWrap").onchange = e => { store("wrap", e.target.checked); applyPrefs(); relayout(); };
document.getElementById("optOrig").onchange = e => { store("orig", e.target.checked); applyPrefs(); relayout(); };
document.getElementById("optPP").onchange = e => { store("pp", +e.target.value); applyPrefs(); relayout(); };
document.getElementById("optShut").onchange = e => {
  document.querySelectorAll("section").forEach(s => { s.classList.toggle("shut", e.target.checked); e.target.checked ? shut.add(s.id) : shut.delete(s.id); });
  store("shut", [...shut]); relayout();
};
function toggleMore(code, btn){
  const s = document.getElementById(code);
  s.classList.toggle("open");
  s.classList.contains("open") ? open.add(code) : open.delete(code);
  store("open", [...open]);
  btn.textContent = s.classList.contains("open") ? "færre" : "flere toppsaker";
  relayout();
}
function toggleShut(code){
  const s = document.getElementById(code);
  s.classList.toggle("shut");
  s.classList.contains("shut") ? shut.add(code) : shut.delete(code);
  store("shut", [...shut]);
  relayout();
}
const li = (it, extraCls, showSource) => `
  <li class="${extraCls}"><span class="t">${esc(ago(it.published))}</span><a href="${esc(it.link)}" target="_blank" rel="noopener noreferrer" title="${esc(it.title)}${it.original ? "\n\n" + esc(it.original) : ""}${showSource && it.source ? "\n— " + esc(it.source) : ""}">${esc(it.title)}</a>${showSource && it.source ? `<span class="m"> · ${esc(it.source)}</span>` : ""}${it.original ? `<span class="orig">${esc(it.original)}</span>` : ""}</li>`;
async function load(){
  let d;
  try {
    const r = await fetch("data.json?" + Date.now());
    if (!r.ok) throw new Error(r.status);
    d = await r.json();
  } catch(e) {
    document.getElementById("meta").textContent = "Fant ingen data ennå (første henting tar noen minutter).";
    return;
  }
  document.getElementById("meta").textContent = "Oppdatert " +
    new Date(d.updated).toLocaleString("no-NO",{dateStyle:"short",timeStyle:"short"}) + " · hvert " + Math.round(d.interval/60) + ". min · utenlandske overskrifter maskinoversatt (hold musen over for original)";
  document.getElementById("nav").innerHTML = d.countries.map(c => `<a class="${c.kind === "tema" ? "tema" : "land"}" href="#${esc(c.code)}">${esc(c.flag)} ${esc(c.name)}</a>`).join("");
  lastCols = 0;
  document.getElementById("main").innerHTML = d.countries.map(c => {
    const items = c.items.map((it, i) => li(it, i >= SHOW ? "extra" : "", true)).join("");
    const papers = (c.papers || []).slice().sort((a, b) => LEANS.indexOf(a.lean) - LEANS.indexOf(b.lean)).map(p => `
      <div class="paper l-${cls(p.lean)}"><h3><a href="${esc(p.home)}" target="_blank" rel="noopener noreferrer">${esc(p.name)}</a>
        <span class="lean l-${cls(p.lean)}">${esc(p.lean || "ukjent")}</span>
        ${p.via && p.via !== "rss" ? `<span class="via" title="Ingen åpen RSS; saker funnet via nyhetssøk (${p.via === "bing" ? "Bing" : "Google News"}) på kildens domene">via søk</span>` : ""}</h3>
        ${p.items.length ? `<ul>${p.items.map((it, i) => li(it, "", false)).join("")}</ul>` : ""}
        ${p.error ? `<p class="err">⚠ ${esc(p.error)}</p>` : ""}</div>`).join("");
    const from = TRANSLATED_FROM[c.lang];
    return `<section data-i="${d.countries.indexOf(c)}" id="${esc(c.code)}" class="k-${c.kind === "tema" ? "tema" : "land"} ${open.has(c.code) ? "open" : ""} ${shut.has(c.code) ? "shut" : ""}">
      <h2 onclick="toggleShut('${esc(c.code)}')"><span>${esc(c.flag)} ${esc(c.name)}</span><small>${from ? "oversatt fra " + from + " · " : ""}${(c.papers||[]).length} ${c.kind === "tema" ? "kilder" : "aviser"}</small></h2>
      ${c.items.length ? `<ol>${items}</ol>` : ""}
      ${c.error ? `<p class="err">⚠ ${esc(c.error)}</p>` : ""}
      ${c.items.length > SHOW ? `<button class="more" onclick="toggleMore('${esc(c.code)}', this)">${open.has(c.code) ? "færre" : "flere toppsaker"}</button>` : ""}
      ${papers ? `<div class="papers">${papers}</div>` : ""}
    </section>`;
  }).join("");
  applyPrefs();
  layout();
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
}
// Murstein: legg landene i rekkefølge, hver i den korteste kolonnen (radvis lesing).
let lastCols = 0;
function layout(force){
  const main = document.getElementById("main");
  const secs = [...main.querySelectorAll("section")].sort((a, b) => +a.dataset.i - +b.dataset.i);
  const all = secs.slice();
  const n = Math.max(1, Math.floor((main.clientWidth + 10) / 340));
  if (!secs.length || (n === lastCols && !force)) return;
  lastCols = n;
  const cols = Array.from({length: n}, () => { const c = document.createElement("div"); c.className = "col"; return c; });
  main.replaceChildren(...cols);
  const h = new Array(n).fill(0);
  for (const s of all) { const i = h.indexOf(Math.min(...h)); cols[i].appendChild(s); h[i] += s.offsetHeight ? s.offsetHeight + 10 : 0; }
}
window.addEventListener("resize", () => layout());
const relayout = () => layout(true);
// 🎲 5 tilfeldige saker blant det som er synlig (respekterer fane og skjulte fløyer)
document.getElementById("rnd").onclick = () => {
  const vis = el => !el || getComputedStyle(el).display !== "none";
  const links = [...document.querySelectorAll("#main li a")]
    .filter(a => vis(a.closest("section")) && !a.closest("section.shut") && vis(a.closest(".paper")) && vis(a.closest("li")));
  const pick = [];
  const pool = links.slice();
  while (pick.length < 5 && pool.length) pick.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  let blocked = 0;
  for (const a of pick) { const w = window.open(a.href, "_blank"); if (w) { try { w.opener = null; } catch (e) {} } else blocked++; }
  document.getElementById("rndlist").innerHTML = pick.map(a => {
    const sec = a.closest("section").querySelector("h2 span").textContent;
    return `<li><a href="${esc(a.href)}" target="_blank" rel="noopener noreferrer">${esc(a.textContent)}</a> <span class="m">· ${esc(sec)}</span></li>`;
  }).join("");
  document.getElementById("rndnote").textContent = blocked ? "Nettleseren blokkerte noen faner – klikk sakene over, eller tillat sprettoppvinduer for denne siden." : "Åpnet i nye faner.";
  document.getElementById("rndbox").style.display = "block";
};
applyPrefs();
load();
setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
