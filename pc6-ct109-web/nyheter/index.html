<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nyheter – toppsaker per land</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--text:#e8eaf0;--dim:#8b93a7;--accent:#7dcfff;--warn:#e0af68}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:2;background:rgba(15,17,21,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 18px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.meta{color:var(--dim);font-size:13px}
.meta a{color:var(--accent);text-decoration:none}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
nav a{font-size:13px;color:var(--text);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
nav a:hover{border-color:var(--accent)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;padding:16px 18px 40px;max-width:1700px;margin:auto}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;scroll-margin-top:110px}
h2{font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{color:var(--dim);font-weight:400;font-size:12px}
ol{margin:0;padding-left:20px}
li{margin:0 0 9px}
li.extra{display:none}
section.open li.extra{display:list-item}
li a{color:var(--text);text-decoration:none;font-weight:550}
li a:visited{color:#a9a3c4}
li a:hover{color:var(--accent);text-decoration:underline}
.orig{display:block;color:var(--dim);font-size:12px;font-style:italic}
.src{display:block;color:var(--dim);font-size:12px}
button.more{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:13px}
.err{color:var(--warn);font-size:12px}
.empty{color:var(--dim)}
.papers{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.ph{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.paper h3{font-size:13px;margin:8px 0 4px}
.paper h3 a{color:var(--accent);text-decoration:none}
.paper ul{margin:0;padding-left:18px}
.paper li{margin-bottom:6px}
.paper li a{font-weight:500}
.lean{display:inline-block;font-size:11px;font-weight:500;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px;border:1px solid currentColor}
.l-venstre{color:#f7768e}.l-sentrum-venstre{color:#ff9e9e}.l-sentrum{color:#c0caf5}.l-sentrum-høyre{color:#7aa2f7}.l-høyre{color:#3d8bff}
.l-allmenn{color:#9ece6a}.l-statlig,.l-regjeringsvennlig{color:#e0af68}.l-opposisjon{color:#bb9af7}.l-ukjent{color:#6b7280}
.legend{color:var(--dim);font-size:12px;margin-top:6px}
.legend .lean{margin:0 4px 0 0}
.via{color:var(--dim);font-size:11px;font-weight:400;margin-left:6px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>📰 Toppsaker per land</h1>
    <span class="meta" id="meta">Laster …</span>
    <span class="meta"><a href="/">← Nettverkskartet</a></span>
  </div>
  <nav id="nav"></nav>
  <div class="legend">Ståsted for dine aviser (omtrentlig, etter AllSides/Ad Fontes/MBFC der det finnes, ellers allmenn oppfatning):
    <span class="lean l-venstre">venstre</span><span class="lean l-sentrum-venstre">sentrum-venstre</span><span class="lean l-sentrum">sentrum</span><span class="lean l-sentrum-høyre">sentrum-høyre</span><span class="lean l-høyre">høyre</span><span class="lean l-allmenn">allmenn</span><span class="lean l-statlig">statlig / regjeringsvennlig</span><span class="lean l-opposisjon">opposisjon</span></div>
</header>
<main id="main"></main>
<script>
const SHOW = 5;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ago(iso){
  if(!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (isNaN(m)) return "";
  if (m < 1) return "nå";
  if (m < 60) return m + " min siden";
  if (m < 48*60) return Math.round(m/60) + " t siden";
  return Math.round(m/1440) + " d siden";
}
const open = new Set(JSON.parse(localStorage.getItem("nyheter-open") || "[]"));
function toggle(code, btn){
  const s = document.getElementById(code);
  s.classList.toggle("open");
  s.classList.contains("open") ? open.add(code) : open.delete(code);
  localStorage.setItem("nyheter-open", JSON.stringify([...open]));
  btn.textContent = s.classList.contains("open") ? "Vis færre" : "Vis flere";
}
async function load(){
  let d;
  try {
    const r = await fetch("data.json?" + Date.now());
    if (!r.ok) throw new Error(r.status);
    d = await r.json();
  } catch(e) {
    document.getElementById("meta").textContent = "Fant ingen data ennå (første henting tar et par minutter).";
    return;
  }
  const upd = new Date(d.updated);
  document.getElementById("meta").textContent =
    "Oppdatert " + upd.toLocaleString("no-NO",{dateStyle:"short",timeStyle:"short"}) +
    " · hentes hvert " + Math.round(d.interval/60) + ". min · utenlandske overskrifter er maskinoversatt";
  document.getElementById("nav").innerHTML = d.countries.map(c =>
    `<a href="#${esc(c.code)}">${esc(c.flag)} ${esc(c.name)}</a>`).join("");
  const li = (it, extra) => `
      <li class="${extra ? "extra" : ""}">
        <a href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a>
        ${it.original ? `<span class="orig">${esc(it.original)}</span>` : ""}
        <span class="src">${esc(it.source)}${it.source && it.published ? " · " : ""}${esc(ago(it.published))}</span>
      </li>`;
  document.getElementById("main").innerHTML = d.countries.map(c => {
    const items = c.items.map((it, i) => li(it, i >= SHOW)).join("");
    const papers = (c.papers || []).map(p => `
      <div class="paper"><h3><a href="${esc(p.home)}" target="_blank" rel="noopener noreferrer">${esc(p.name)}</a>${p.lean ? `<span class="lean l-${esc(p.lean)}">${esc(p.lean)}</span>` : ""}${p.via === "gnews" ? `<span class="via" title="Avisen har ingen åpen RSS; sakene er funnet via Google News-søk på avisens domene">via søk</span>` : ""}</h3>
      ${p.items.length ? `<ul>${p.items.map(it => li(it, false)).join("")}</ul>` : ""}
      ${p.error ? `<p class="err">⚠ ${esc(p.error)}</p>` : ""}</div>`).join("");
    const more = c.items.length > SHOW
      ? `<button class="more" onclick="toggle('${esc(c.code)}', this)">${open.has(c.code) ? "Vis færre" : "Vis flere"}</button>` : "";
    return `<section id="${esc(c.code)}" class="${open.has(c.code) ? "open" : ""}">
      <h2><span>${esc(c.flag)} ${esc(c.name)}</span><small>${c.lang === "no" || c.lang === "sv" || c.lang === "da" || c.lang === "en" ? "" : "oversatt fra " + esc(c.lang)}</small></h2>
      ${c.items.length ? `<ol>${items}</ol>` : ((c.papers || []).length ? "" : `<p class="empty">Ingen saker.</p>`)}
      ${c.error ? `<p class="err">⚠ ${esc(c.error)}</p>` : ""}
      ${more}
      ${papers ? `<div class="papers"><div class="ph">Fra dine aviser</div>${papers}</div>` : ""}
    </section>`;
  }).join("");
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
}
load();
setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
