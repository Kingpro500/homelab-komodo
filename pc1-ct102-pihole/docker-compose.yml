services:
  pihole:
    image: pihole/pihole:2026.09.0
    hostname: pihole-pc9
    ports:
      - "10.0.0.116:53:53/tcp"
      - "10.0.0.116:53:53/udp"
      - "10.0.0.116:8080:80/tcp"
    environment:
      TZ: Europe/Oslo
      FTLCONF_webserver_api_password: "${PIHOLE_WEB_PASSWORD:?set in Komodo}"
      FTLCONF_dns_upstreams: "10.0.0.1#53"
      FTLCONF_dns_revServers: "true,10.0.0.0/24,10.0.0.1#53,lan.local"
      FTLCONF_dns_listeningMode: ALL
    volumes:
      - pihole_data:/etc/pihole
    restart: unless-stopped
volumes:
  pihole_data:
    external: true
    name: pihole-pc9_pihole_data
