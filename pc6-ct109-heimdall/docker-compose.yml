services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    container_name: heimdall
    restart: unless-stopped
    ports:
      - "3012:80"
    environment:
      PUID: "99"
      PGID: "100"
      TZ: Europe/Oslo
      # Heimdall blocks lookups to private IPs by default. Every service on this
      # dashboard is RFC1918, so this has to be true for the search to work.
      ALLOW_INTERNAL_REQUESTS: "true"
    volumes:
      # Named volume: Docker creates it on first deploy. Holds the SQLite
      # database Heimdall 2.8 stores apps in, plus its generated app key.
      - heimdall-data:/config

volumes:
  heimdall-data: