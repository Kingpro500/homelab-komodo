---
# SSH-inventory for operasjonelle playbooks (deploy + driftsrapport).
# Nås som root via SSH-nøkkel (~/.ssh/id_ed25519_hermes) og `pct exec`.
# NB: dette er WRITE-tilgang til nodene — bruk kun til godkjente driftsoppgaver.
all:
  children:
    proxmox_ssh:
      hosts:
        pve:
          ansible_host: 10.0.0.102
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519_hermes
        pc6:
          ansible_host: 10.0.0.120
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519_hermes
        pc9:
          ansible_host: 10.0.0.103
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519_hermes
        pc1:
          ansible_host: 10.0.0.112
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519_hermes
