# Reserve Emby, deployed by Komodo.
services:
  emby:
    image: emby/embyserver:4.10.0.40
    container_name: emby-backup
    hostname: emby-backup
    network_mode: host
    environment:
      UID: "${EMBY_UID:-2}"
      GID: "${EMBY_GID:-2}"
      GIDLIST: "${EMBY_GIDLIST:-2,44}"
      TZ: "${TZ:-Europe/Oslo}"
    volumes:
      - "${EMBY_CONFIG_PATH:?Set EMBY_CONFIG_PATH in Komodo}:/config"
      - "${EMBY_BACKUP_PATH:?Set EMBY_BACKUP_PATH in Komodo}:/backups"
      - "${EMBY_TRANSCODE_PATH:?Set EMBY_TRANSCODE_PATH in Komodo}:/transcode"
      - "${EMBY_MEDIA_PATH:?Set EMBY_MEDIA_PATH in Komodo}:${EMBY_LIBRARY_PATH:?Set EMBY_LIBRARY_PATH in Komodo}:ro"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
