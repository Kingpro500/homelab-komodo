# Network and storage testing services on Proxmox CT 104 (pc6).
services:
  myspeed:
    image: germannewsmaker/myspeed:latest
    container_name: myspeed
    ports:
      - "5216:5216"
    environment:
      TZ: "${TZ:-Europe/Oslo}"
    volumes:
      - "${MYSPEED_DATA_PATH:?Set MYSPEED_DATA_PATH in Komodo}:/myspeed/data"
    restart: unless-stopped

  diskspeed:
    image: jbartlett777/diskspeed:latest
    container_name: diskspeed
    ports:
      - "8888:8888"
    environment:
      TZ: "${TZ:-Europe/Oslo}"
    volumes:
      - "${DISKSPEED_DATA_PATH:?Set DISKSPEED_DATA_PATH in Komodo}:/tmp/DiskSpeed"
    privileged: true
    restart: unless-stopped
