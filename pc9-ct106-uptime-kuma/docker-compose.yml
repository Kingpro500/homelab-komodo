# Uptime Kuma på pc9 / CT106 (10.0.0.122:3002).
#
# Databasen ligger på verten, ikke i Git-klonen: Komodo kloner repoet på nytt
# ved behov, og en relativ `./data` ville da pekt på en tom mappe.
services:
  uptime-kuma-pc9:
    image: louislam/uptime-kuma:2.5.7
    container_name: uptime-kuma-pc9
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - "${UPTIME_KUMA_DATA_PATH:?Set UPTIME_KUMA_DATA_PATH in Komodo}:/app/data"
