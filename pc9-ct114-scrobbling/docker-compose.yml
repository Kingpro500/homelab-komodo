# Koito (scrobble-historikk, ListenBrainz-kompatibel) + multi-scrobbler (henter avspillinger
# fra kilder og sender dem til Koito). Kjører i CT114 ved siden av Navidrome.
# Hemmeligheter står i Komodo-stackens Environment, aldri i git:
#   KOITO_DEFAULT_PASSWORD  passord for første Koito-bruker (brukes bare ved første oppstart)
#   KOITO_TOKEN             Koito API-nøkkel som multi-scrobbler sender med
#   SPOTIFY_CLIENT_ID/SECRET  Spotify-app «multi-scrobbler» (developer.spotify.com)
services:
  koito:
    image: gabehf/koito:latest
    container_name: koito
    restart: unless-stopped
    ports:
      - "4110:4110"
    environment:
      TZ: Europe/Oslo
      KOITO_DEFAULT_USERNAME: roger
      KOITO_DEFAULT_PASSWORD: ${KOITO_DEFAULT_PASSWORD:?settes i Komodo-stackens Environment}
    volumes:
      - /opt/scrobbling/koito:/etc/koito
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  multi-scrobbler:
    image: foxxmd/multi-scrobbler:latest
    container_name: multi-scrobbler
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      - koito
    ports:
      - "9078:9078"
    environment:
      TZ: Europe/Oslo
      BASE_URL: http://10.0.0.172:9078
      # Klient: Koito (multi-scrobbler legger selv til /apis/listenbrainz)
      KOITO_ID: koito
      KOITO_URL: http://koito:4110
      KOITO_USER: roger
      KOITO_TOKEN: ${KOITO_TOKEN:-}
      # Kilde: Web Scrobbler-utvidelsen (Qobuz m.m.) -> http://10.0.0.172:9078/api/webscrobbler
      WS_ID: webscrobbler
      # Kilde: Spotify (egen Spotify-app). Spotify godtar bare 127.0.0.1-redirect over http:
      # etter godkjenning, bytt 127.0.0.1 med 10.0.0.172 i adressefeltet for å fullføre.
      SPOTIFY_ID: spotify
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:?settes i Komodo-stackens Environment}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:?settes i Komodo-stackens Environment}
      SPOTIFY_REDIRECT_URI: http://127.0.0.1:9078/callback
      # Kilde: Sonos (lokal API). Én høyttaler holder; multi-scrobbler ser alle soner/grupper derfra.
      # Sonos-kilden følger bare én spiller om gangen (se README), så Lampe (sovemusikk) er blokkert.
      SONOS_ID: sonos
      SONOS_HOST: 10.0.0.15   # Sonos Arc, «Stue Arc Sonos»
      SONOS_DEVICES_BLOCK: lampe
    volumes:
      - /opt/scrobbling/multi-scrobbler/config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
