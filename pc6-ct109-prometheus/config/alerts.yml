groups:
  - name: homelab-resources
    rules:
      - alert: GuestMemoryHigh
        expr: max by (name, node, type, vmid) ((proxmox_guest_mem_used_bytes / proxmox_guest_mem_total_bytes) * 100) >= 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAM høy: {{ $labels.name }} ({{ $labels.node }})"
          description: "{{ $labels.name }} på {{ $labels.node }} bruker {{ $value | printf \"%.0f\" }} % av RAM. Vurder å rydde eller skaffe mer."

      - alert: GuestMemoryCritical
        expr: max by (name, node, type, vmid) ((proxmox_guest_mem_used_bytes / proxmox_guest_mem_total_bytes) * 100) >= 97
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "RAM TOMT: {{ $labels.name }} ({{ $labels.node }})"
          description: "{{ $labels.name }} på {{ $labels.node }} bruker {{ $value | printf \"%.0f\" }} % av RAM — fare for OOM-kill / swapping."

      - alert: GuestDiskHigh
        expr: max by (name, node, type, vmid) ((proxmox_guest_disk_used_bytes / proxmox_guest_disk_total_bytes) * 100) >= 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk høy: {{ $labels.name }} ({{ $labels.node }})"
          description: "{{ $labels.name }} på {{ $labels.node }} bruker {{ $value | printf \"%.0f\" }} % av disken."

      - alert: GuestDiskCritical
        expr: max by (name, node, type, vmid) ((proxmox_guest_disk_used_bytes / proxmox_guest_disk_total_bytes) * 100) >= 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk TOMT: {{ $labels.name }} ({{ $labels.node }})"
          description: "{{ $labels.name }} på {{ $labels.node }} bruker {{ $value | printf \"%.0f\" }} % av disken."

      - alert: GuestSustainedCPU
        expr: max by (name, node, type, vmid) (proxmox_guest_cpu_percent) >= 90
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "CPU høyt: {{ $labels.name }} ({{ $labels.node }})"
          description: "{{ $labels.name }} på {{ $labels.node }} har ligget over 90 % CPU i 15 min."

      - alert: PC1GPUTemperatureHigh
        expr: pc1_gpu_temperature_celsius >= 75
        for: 2m
        labels:
          severity: warning
          node: pc1
        annotations:
          summary: "PC1 GPU varm: {{ $value | printf \"%.0f\" }} °C"
          description: "RTX 3070 på PC1 har vært over 75 °C i minst 2 minutter. AI-modus skal frigjøre PC1-ressurser, men ikke restarte maskinen automatisk."

      - alert: PC1GPUTemperatureCritical
        expr: pc1_gpu_temperature_celsius >= 82
        for: 1m
        labels:
          severity: critical
          node: pc1
        annotations:
          summary: "PC1 GPU KRITISK VARM: {{ $value | printf \"%.0f\" }} °C"
          description: "RTX 3070 på PC1 har vært over 82 °C. Stopp AI-belastningen og kontroller kjøling/power-limit."

  - name: emby
    rules:
      - alert: EmbyDown
        expr: emby_up{instance="emby"} == 0
        for: 3m
        labels:
          severity: critical
          service: emby
        annotations:
          summary: "Emby er utilgjengelig"
          description: "Autentisert Emby-probe har feilet i minst 3 minutter. Recovery skal fortsatt være blokkert dersom sessions-status ikke kan verifiseres."

      - alert: EmbySessionsUnknown
        expr: emby_up{instance="emby"} == 1 and emby_sessions_known{instance="emby"} == 0
        for: 5m
        labels:
          severity: warning
          service: emby
        annotations:
          summary: "Emby sessions kan ikke leses"
          description: "Emby svarer, men sessions-status er ukjent. Autorestart skal ikke tillates før sessions kan leses."

      - alert: EmbyProbeDegraded
        expr: emby_up{instance="emby"} == 1 and emby_probe_success{instance="emby"} < emby_probe_total{instance="emby"}
        for: 10m
        labels:
          severity: warning
          service: emby
        annotations:
          summary: "Emby-proben er ustabil"
          description: "Emby svarer, men én eller flere av de siste autentiserte probene feiler over tid."