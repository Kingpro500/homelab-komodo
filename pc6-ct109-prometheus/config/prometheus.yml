global:
  # 30s is plenty for a "running out of disk/RAM?" view.
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'homelab-resources'
    # Autorisativ per-gjest CPU/RAM/disk fra Proxmox, servert av eksportøren
    # homelab_metrics_exporter.py på CT157 (10.0.0.135:9120/metrics). Rent
    # Prometheus-format, i motsetning til Netdata (som Prometheus avviser).
    scrape_interval: 30s
    static_configs:
      - targets: ['10.0.0.135:9120']

  - job_name: 'unraid-storage'
    # Unraid (Tower) disk/fillbruk fra Unraid GraphQL, servert av samme eksportør
    # (homelab_metrics_exporter.py på CT157). Metrikker: unraid_array_*,
    # unraid_device_* (disk/cache) og unraid_share_*. Lytt egen jobb så dashbord
    # og alert-regler kan filtrere på job="unraid-storage".
    scrape_interval: 60s
    static_configs:
      - targets: ['10.0.0.135:9120']